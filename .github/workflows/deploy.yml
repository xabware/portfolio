name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ['main']

  workflow_dispatch:
    inputs:
      analytics_enabled:
        description: 'Activar analíticas en este despliegue'
        required: false
        type: boolean
        default: false
      firebase_cms_enabled:
        description: 'Cargar contenido CMS desde Firebase'
        required: false
        type: boolean
        default: false
      base_path:
        description: 'Base publica de Vite: / para dominio raiz, /portfolio/ para GitHub Pages de proyecto'
        required: false
        type: string
        default: '/'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_ANALYTICS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.analytics_enabled && 'true' || 'false' }}
          VITE_FIREBASE_CMS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.firebase_cms_enabled && 'true' || 'false' }}
          VITE_BASE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.base_path || '/' }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
